<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Friends English Practice</title>
<style>
    :root {
        --primary: #6c3fa8;
        --accent: #f0b429;
        --bg: #faf7f2;
        --card: #ffffff;
        --text: #2d2a26;
        --muted: #7a746c;
        --good: #2e9e6b;
        --bad: #d64545;
        --border: #e4ddd0;
    }
    * { box-sizing: border-box; }
    body {
        font-family: "Segoe UI", Helvetica, Arial, sans-serif;
        background: var(--bg);
        margin: 0;
        padding: 20px;
        color: var(--text);
    }
    .container { max-width: 980px; margin: 0 auto; }
    header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 18px;
    }
    header h1 { margin: 0; color: var(--primary); font-size: 26px; }
    header p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
    nav.tabs {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 18px;
        border-bottom: 2px solid var(--border);
        padding-bottom: 10px;
    }
    .tab-btn {
        background: #fff;
        border: 2px solid var(--border);
        color: var(--text);
        padding: 8px 16px;
        border-radius: 20px;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        transition: all .15s;
    }
    .tab-btn:hover { border-color: var(--primary); }
    .tab-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; }
    .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 20px;
        margin-bottom: 18px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }
    .empty-state { text-align: center; color: var(--muted); padding: 40px 20px; }
    .season-group { margin-bottom: 16px; }
    .season-title { font-weight: 700; color: var(--primary); margin-bottom: 8px; font-size: 15px; }
    .episode-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 14px;
        border: 1px solid var(--border);
        border-radius: 8px;
        margin-bottom: 8px;
        background: #fffdf9;
        flex-wrap: wrap;
    }
    .episode-row .ep-info { font-size: 14px; }
    .episode-row .ep-info .ep-tag { color: var(--muted); font-size: 12px; display: block; }
